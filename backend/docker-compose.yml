services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: archaeologist, POSTGRES_PASSWORD: archaeologist, POSTGRES_DB: archaeologist }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U archaeologist"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://archaeologist:archaeologist@postgres:5432/archaeologist
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://archaeologist:archaeologist@postgres:5432/archaeologist
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
volumes: { postgres_data: {} }
